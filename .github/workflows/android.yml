name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LumiSoundbox-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LumiSoundbox-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Lumi Soundbox v1.1.0 (Smart UPI Voice Soundbox • By Kaif)"
          body: |
            ### 🔊 Lumi Soundbox v1.1.0 — Smart Offline UPI Voice Soundbox
            **Developed by Kaif** • Instagram: [@Kaif_7.0x](https://instagram.com/Kaif_7.0x)

            ---

            ### 🚀 What's New & Fixed in v1.1.0:
            - 🚫 **100% Mock Data Removed:** Zero dummy transactions (no fake ₹12,450 or Rahul Kumar mock transactions). Clean real-time zero state.
            - 🔊 **Quick Speaker Voice Test Button:** One-tap test button right on Home & Live screens to test speaker volume & Hindi TTS instantly.
            - 🛡️ **Play Protect Alert Fixes:** Removed obsolete broadcast receivers and sanitized root checks so sideloading runs smoothly.
            - ⚙️ **Direct Android 13/14/15 Permission Guidance:** Built-in buttons for opening Notification Access and App Info ("Allow restricted settings").
            - ⚡ **Instant UPI Announcements:** Automatic loud voice alerts for Google Pay, PhonePe, Paytm, BHIM, and bank SMS.
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
