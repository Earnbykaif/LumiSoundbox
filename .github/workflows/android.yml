name: Android CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: LumiSoundbox-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LumiSoundbox-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Lumi Soundbox v1.2.0 (Smart UPI Voice Soundbox • By Kaif)"
          body: |
            ### 🔊 Lumi Soundbox v1.2.0 — Smart Offline UPI Voice Soundbox
            **Developed by Kaif** • Instagram: [@Kaif_7.0x](https://instagram.com/Kaif_7.0x)

            ---

            ### 🚀 What's New in v1.2.0:
            - 🎯 **Dedicated Standby Mode for Live Console:** No more fake receipt cards or "₹0" receipts! Shows clean active standby mode until a real payment is captured.
            - 🚫 **All Preview Sample Names Cleaned:** Removed sample names from Voice personas and Diagnostics screen.
            - 🔊 **One-Tap Voice Speaker Test:** Verify soundbox audio volume and Hindi TTS instantly.
            - 🛡️ **Zero Security Flags & Clean Background Service:** Pure offline operation.
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
